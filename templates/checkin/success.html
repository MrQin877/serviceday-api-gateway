{% extends "base.html" %}

{% block content %}

<div class="min-h-[70vh] flex items-center justify-center px-4">
    <div class="bg-white rounded-3xl shadow-xl border border-gray-100 p-10 max-w-md w-full text-center">

        {% if 'successful' in message %}
            <!-- Success State -->
            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <span class="text-4xl">✅</span>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Check-In Successful!</h1>
            <p class="text-gray-500 text-sm mb-8">{{ message }}</p>

            <div class="bg-gradient-to-r from-[#FFF4A3] to-[#B8E6B8] rounded-2xl p-4 mb-8">
                <p class="text-sm font-semibold text-gray-700">
                    🌱 Thank you for participating in Service Day!
                </p>
            </div>

        {% else %}
            <!-- Error State -->
            <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <span class="text-4xl">❌</span>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Check-In Failed</h1>
            <p class="text-gray-500 text-sm mb-8">{{ message }}</p>
        {% endif %}

        <a href="{% url 'employee_dashboard' %}"
           class="inline-block bg-gray-900 text-[#FFF4A3] font-bold text-sm
                  px-8 py-3 rounded-2xl shadow-md hover:bg-gray-700
                  hover:shadow-lg transition w-full">
            Back to Dashboard
        </a>

    </div>
</div>

{% endblock %}
